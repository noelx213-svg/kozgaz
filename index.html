<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="description" content="Közgazdaságtan fogalomtanuló app: 72 fogalom, Leitner ismétléssel, napi tanulótervvel és próbavizsgával.">
<title>Közgazdaságtan Fogalomtanuló</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;
  --bg2:#0f0f17;
  --card:#14141f;
  --card2:#1b1b29;
  --line:#272739;
  --txt:#f2f2f7;
  --mut:#9a9ab0;
  --acc:#7c3aed;
  --acc2:#a78bfa;
  --ok:#10b981;
  --bad:#ef4444;
  --warn:#f59e0b;
  --info:#0ea5e9;
  --r:16px;
  --sh:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1000px 600px at 50% -10%,#1b1430 0%,var(--bg) 55%) fixed;
  color:var(--txt);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;
  padding-bottom:90px;
  font-size:16px;
  line-height:1.55;
}
.wrap{max-width:780px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0 0 10px;line-height:1.25}
h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0 0 10px}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;border-radius:12px}
.hidden{display:none !important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
  background:rgba(10,10,15,.82);border-bottom:1px solid var(--line)}
.top .inner{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;font-size:15px;letter-spacing:-.3px;display:flex;align-items:center;gap:7px}
.lvl{background:linear-gradient(135deg,var(--acc),var(--info));padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800}
.streak{margin-left:auto;font-size:13px;font-weight:700;color:var(--warn);display:flex;align-items:center;gap:4px}
.xpbar{height:6px;background:#22223a;border-radius:99px;overflow:hidden;max-width:780px;margin:0 auto}
.xpfill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xptxt{max-width:780px;margin:4px auto 0;padding:0 16px 8px;font-size:11px;color:var(--mut);display:flex;justify-content:space-between}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card.tight{padding:13px}
.muted{color:var(--mut);font-size:13.5px}
.tiny{font-size:12px;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center}
.sb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* ---------- buttons ---------- */
.btn{background:var(--acc);color:#fff;padding:13px 18px;font-weight:700;width:100%;transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
.btn.ok{background:var(--ok)}
.btn.bad{background:#3a2130;border:1px solid #512a39;color:#ffb4c4}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mut)}
.btn.sm{padding:9px 14px;font-size:13.5px;width:auto}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- module tiles ---------- */
.mod{display:flex;gap:13px;align-items:flex-start;cursor:pointer;transition:transform .15s,border-color .2s}
.mod:hover{transform:translateY(-2px);border-color:var(--acc)}
.mod .em{font-size:26px;line-height:1}
.ring{--p:0;width:46px;height:46px;border-radius:50%;flex:0 0 46px;
  background:conic-gradient(var(--ok) calc(var(--p)*1%),#272739 0);
  display:grid;place-items:center;font-size:11px;font-weight:800}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.bar{height:7px;background:#232338;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#34d399);transition:width .5s}

/* ---------- learn / flashcard ---------- */
.concept-name{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#241d3d;color:var(--acc2);margin-bottom:10px}
.def{background:var(--card2);border-left:3px solid var(--acc);padding:12px 14px;border-radius:10px;margin:10px 0;font-size:15px}
.blk{margin-top:12px}
.blk .lbl{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.blk.ex{border-left:3px solid var(--info);padding-left:11px}
.blk.tip{border-left:3px solid var(--warn);padding-left:11px}

.flip{perspective:1400px;min-height:270px;margin-bottom:14px}
.flip-in{position:relative;width:100%;min-height:270px;transition:transform .6s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d;cursor:pointer}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:20px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--sh);overflow:auto}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#17142a,#14141f)}

/* ---------- quiz ---------- */
.q{font-size:17px;font-weight:600;margin-bottom:14px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1.5px solid var(--line);
  color:var(--txt);padding:13px 15px;border-radius:12px;margin-bottom:9px;font-size:14.5px;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateX(3px)}
.opt.right{border-color:var(--ok);background:rgba(16,185,129,.14)}
.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.12)}
.fb{border-radius:12px;padding:13px 15px;margin-top:12px;font-size:14px;animation:up .3s ease}
.fb.good{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4)}
.fb.bad{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35)}
.fb b{display:block;margin-bottom:5px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.prog{height:6px;background:#232338;border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--info));transition:width .35s}

/* ---------- plan ---------- */
.day{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:none}
.daynum{flex:0 0 42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:13px}
.day.done .daynum{background:rgba(16,185,129,.18);color:var(--ok)}
.day.today .daynum{background:linear-gradient(135deg,var(--acc),var(--info));color:#fff}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#232338;color:var(--mut);margin:3px 5px 0 0}

/* ---------- stats ---------- */
.stat{background:var(--card2);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:11px;color:var(--mut)}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
  padding:7px 11px;border-radius:99px;font-size:12.5px;font-weight:600;margin:0 6px 6px 0}
.badge.off{opacity:.33}

.clist{max-height:420px;overflow:auto}
.citem{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.citem:last-child{border:none}
.box{flex:0 0 26px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;background:#232338;color:var(--mut)}
.box.b1{background:rgba(239,68,68,.18);color:#fca5a5}
.box.b2{background:rgba(245,158,11,.18);color:#fcd34d}
.box.b3{background:rgba(14,165,233,.18);color:#7dd3fc}
.box.b4,.box.b5{background:rgba(16,185,129,.18);color:#6ee7b7}

/* ---------- bottom nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(14,14,22,.95);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav .inner{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;padding:9px 2px 11px;color:var(--mut);font-size:10.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:0}
.nav button .i{font-size:19px;line-height:1}
.nav button.on{color:var(--acc2)}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--card2);
  border:1px solid var(--acc);padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;
  z-index:99;box-shadow:var(--sh);animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.center{text-align:center}
input[type=date],select{background:var(--card2);border:1px solid var(--line);color:var(--txt);
  padding:10px 12px;border-radius:10px;font-family:inherit;font-size:14px;width:100%}
@media(max-width:420px){
  h1{font-size:20px}
  .concept-name{font-size:19px}
  .grid3{grid-template-columns:1fr 1fr}
}

</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
</head>
<body>

<header class="top">
  <div class="inner">
    <div class="brand">📈 Közgazdaságtan <span class="lvl" id="lvl">Szint 1</span></div>
    <div class="streak" id="streak">🔥 0</div>
  </div>
  <div class="xpbar"><div class="xpfill" id="xpfill" style="width:0%"></div></div>
  <div class="xptxt"><span id="xpnow">0 XP</span><span id="xpnext"></span></div>
</header>

<main class="wrap" id="app"></main>

<nav class="nav">
  <div class="inner">
    <button data-v="home" class="on" onclick="nav('home')"><span class="i">🏠</span>Főoldal</button>
    <button data-v="plan" onclick="nav('plan')"><span class="i">🗓️</span>Terv</button>
    <button data-v="flash" onclick="nav('flash',{ids:allIds(),i:0})"><span class="i">🃏</span>Kártyák</button>
    <button data-v="quiz" onclick="nav('quiz')"><span class="i">🎯</span>Kvíz</button>
    <button data-v="prog" onclick="nav('prog')"><span class="i">📊</span>Haladás</button>
  </div>
</nav>

    long: "A szűkösség nem azonos a szegénységgel. Akkor is szűkösség van, ha sok minden rendelkezésre áll, de kevesebb, mint amennyit a szükségletek igényelnének. Ez a közgazdaságtan létének az oka.",

    long: "A szükséglet tehát hiányérzet plusz cselekvési késztetés. Nem elég érezni a hiányt, a szükséglet arra is rávesz, hogy tegyünk érte. A szükségletek folyamatosan megújulnak, ezért ismétlődik a gazdasági körforgás.",

  {

    example: "Kenyér, cipő, telefon, lakás.",

    tip: "A fogalom kulcsszava az ismétlődés és az újratermelés.",

  },
  {
    id: "gazdasagi-rendszerek",
    m: "m1",

    short: "A gazdasági szereplők között kialakuló kapcsolatok összessége, a gazdasági körforgás megvalósulásának mechanizmusa.",

  },
  {

    example: "Egy bolt azért nem emel árat, mert tudja, hogy a vevők átmennének a szomszéd üzletbe.",

/* =========================================================
   Közgazdaságtan Fogalomtanuló
   Teljes tanulómotor: Leitner ismétlés + napi terv + kvíz
   ========================================================= */

const STORE = 'kozgaz_app_v1';
const CONCEPTS = window.CONCEPTS || [];
const MODULES = window.MODULES || [];
const BOX_DAYS = [0, 1, 2, 4, 8, 16];   // 1..5 doboz -> hány nap múlva jön vissza
const LEVEL_XP = 120;                    // ennyi XP egy szint

/* ---------- segédfüggvények ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayStr = () => new Date().toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0,10); };
const dayDiff = (a, b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
const shuffle = a => { const r = a.slice(); for (let i = r.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]] = [r[j],r[i]]; } return r; };
const byId = id => CONCEPTS.find(c => c.id === id);
const modOf = id => MODULES.find(m => m.id === id);

/* ---------- állapot ---------- */
let S = null;

function defaultState() {
  const t = todayStr();
  return {
    xp: 0, streak: 0, lastActive: t, startDate: t,
    examDate: addDays(t, 13),
    cards: {}, badges: [], dayLog: {},
    stats: { qTotal: 0, qOk: 0, examBest: 0, examRuns: 0 }
  };
}
function load() {
  try { S = JSON.parse(localStorage.getItem(STORE)) || defaultState(); }
  catch (e) { S = defaultState(); }
  const d = defaultState();
  for (const k in d) if (S[k] === undefined) S[k] = d[k];
  CONCEPTS.forEach(c => {
    if (!S.cards[c.id]) S.cards[c.id] = { box: 0, due: null, seen: 0, ok: 0, bad: 0 };
  });
  checkStreak();
  save();
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }

function checkStreak() {
  const t = todayStr();
  if (S.lastActive === t) return;
  const diff = dayDiff(S.lastActive, t);
  if (diff === 1) S.streak += 1;
  else if (diff > 1) S.streak = 0;
  S.lastActive = t;
}
function logDay(key, n) {
  const t = todayStr();
  S.dayLog[t] = S.dayLog[t] || { nw: 0, rev: 0, xp: 0, q: 0 };
  S.dayLog[t][key] = (S.dayLog[t][key] || 0) + n;
}
function addXP(n) {
  const before = level();
  S.xp += n; logDay('xp', n);
  if (level() > before) toast('🎉 Új szint: ' + level() + '!');
  save(); renderTop();
}
const level = () => Math.floor(S.xp / LEVEL_XP) + 1;
const levelPct = () => Math.round((S.xp % LEVEL_XP) / LEVEL_XP * 100);

/* ---------- Leitner ismétlés ---------- */
function grade(id, correct) {
  const c = S.cards[id];
  c.seen++;
  if (correct) {
    c.ok++;
    c.box = Math.min(5, (c.box || 0) + 1);
    addXP(c.box >= 4 ? 4 : 6);
  } else {
    c.bad++;
    c.box = 1;
    addXP(1);
  }
  c.due = addDays(todayStr(), BOX_DAYS[c.box]);
  if (c.box === 1 && !correct) c.due = todayStr();
  save(); checkBadges();
}
const isLearned = id => (S.cards[id].box || 0) >= 1;
const isMastered = id => (S.cards[id].box || 0) >= 4;
const dueCards = () => CONCEPTS.filter(c => { const k = S.cards[c.id]; return k.box > 0 && k.due && k.due <= todayStr(); });
const newCards = () => CONCEPTS.filter(c => (S.cards[c.id].box || 0) === 0);
const learnedCount = () => CONCEPTS.filter(c => isLearned(c.id)).length;
const masteredCount = () => CONCEPTS.filter(c => isMastered(c.id)).length;

function modStats(mid) {
  const list = CONCEPTS.filter(c => c.m === mid);
  const lrn = list.filter(c => isLearned(c.id)).length;
  const mst = list.filter(c => isMastered(c.id)).length;
  return { total: list.length, lrn, mst, pct: Math.round(mst / list.length * 100) };
}

/* ---------- tanulási terv ---------- */
function planDays() {
  const start = S.startDate, exam = S.examDate;
  let n = Math.max(3, Math.min(40, dayDiff(start, exam) + 1));
  const learnDays = Math.max(1, n - 2);           // utolsó 2 nap: ismétlés + próbavizsga
  const per = Math.ceil(CONCEPTS.length / learnDays);
  const order = CONCEPTS.slice();                 // modul sorrendben
  const days = [];
  let i = 0;
  for (let d = 0; d < n; d++) {
    const date = addDays(start, d);
    const chunk = d < learnDays ? order.slice(i, i + per) : [];
    i += chunk.length;
    days.push({
      n: d + 1,
      date,
      newIds: chunk,
      kind: d < learnDays ? 'tanulás' : (d === n - 2 ? 'teljes ismétlés' : 'próbavizsga')
    });
  }
  return days;
}
function todayPlan() {
  const days = planDays(), t = todayStr();
  return days.find(d => d.date === t) || days.find(d => d.date > t) || days[days.length - 1];
}

/* ---------- kitűzők ---------- */
const BADGES = [
  { id: 'start',   emoji: '🚀', name: 'Első lépés',    test: () => learnedCount() >= 1 },
  { id: 'ten',     emoji: '🔟', name: '10 fogalom',    test: () => learnedCount() >= 10 },
  { id: 'm1',      emoji: '📘', name: '1. modul kész', test: () => modStats('m1').mst === modStats('m1').total },
  { id: 'm2',      emoji: '⚖️', name: '2. modul kész', test: () => modStats('m2').mst === modStats('m2').total },
  { id: 'm3',      emoji: '📈', name: '3. modul kész', test: () => modStats('m3').mst === modStats('m3').total },
  { id: 'half',    emoji: '🏅', name: 'Félút (36)',    test: () => masteredCount() >= 36 },
  { id: 'all',     emoji: '👑', name: 'Mind a 72',     test: () => masteredCount() === CONCEPTS.length },
  { id: 'streak3', emoji: '🔥', name: '3 napos sorozat', test: () => S.streak >= 3 },
  { id: 'streak7', emoji: '💎', name: '7 napos sorozat', test: () => S.streak >= 7 },
  { id: 'exam80',  emoji: '🎓', name: 'Vizsga 80%+',   test: () => S.stats.examBest >= 80 }
];
function checkBadges() {
  BADGES.forEach(b => {
    if (!S.badges.includes(b.id) && b.test()) { S.badges.push(b.id); toast(b.emoji + ' Kitűző: ' + b.name); }
  });
  save();
}

/* ---------- kérdésgenerátor ---------- */
function distractors(c, n) {
  let pool = (c.confuse || []).map(byId).filter(Boolean);
  pool = pool.concat(shuffle(CONCEPTS.filter(x => x.m === c.m && x.id !== c.id && !pool.includes(x))));
  pool = pool.concat(shuffle(CONCEPTS.filter(x => x.id !== c.id)));
  const out = [];
  for (const p of pool) { if (p.id !== c.id && !out.find(o => o.id === p.id)) out.push(p); if (out.length === n) break; }
  return out;
}
function trim(t, n) { return t.length > n ? t.slice(0, n).replace(/[\s,.;:]+\S*$/, '') + '…' : t; }

function makeQuestion(c) {
  const type = ['def', 'name', 'ex'][Math.floor(Math.random() * 3)];
  const d = distractors(c, 3);
  let prompt, optText;
  if (type === 'def') {
    prompt = 'Melyik fogalom meghatározása ez?<br><span class="muted">„' + esc(trim(c.short, 230)) + '”</span>';
    optText = x => x.name;
  } else if (type === 'ex') {
    prompt = 'Melyik fogalomra illik ez a példa?<br><span class="muted">„' + esc(c.example) + '”</span>';
    optText = x => x.name;
  } else {
    prompt = 'Mit jelent: <b>' + esc(c.name) + '</b>?';
    optText = x => trim(x.short, 115);
  }
  const opts = shuffle([c, ...d]).map(x => ({ id: x.id, text: optText(x) }));
  return { cid: c.id, prompt, opts, type };
}
function buildQuiz(list, count) {
  const pick = shuffle(list).slice(0, count);
  return pick.map(makeQuestion);
}

/* ---------- toast ---------- */
let tTimer;
function toast(msg) {
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(tTimer); tTimer = setTimeout(() => el.style.display = 'none', 2200);
}

    <p class="muted">${esc(m.desc)}</p>
    <div class="bar"><i style="width:${st.pct}%"></i></div>
    <div class="tiny" style="margin-top:6px">${st.mst} bevésve / ${st.lrn} látott / ${st.total} fogalom</div>
    <div class="grid2" style="margin-top:12px">
      <button class="btn" onclick="nav('learning',{ids:modIds('${mid}'),i:0})">📚 Átvétel</button>
      <button class="btn sec" onclick="nav('quizrun',{qs:buildQuiz(CONCEPTS.filter(c=>c.m==='${mid}'),10),i:0,ok:0,title:'${esc(m.title)} kvíz'})">🎯 Kvíz (10)</button>
    </div>
    <button class="btn sec" style="margin-top:8px" onclick="nav('flash',{ids:modIds('${mid}')})">🃏 Villámkártyák</button>
  </div>
  <div class="card">
    <h3>Fogalmak (${list.length})</h3>
    <div class="clist">
      ${list.map(c => { const b = S.cards[c.id].box || 0; return `
        <div class="citem" onclick="nav('learning',{ids:['${c.id}'],i:0})" style="cursor:pointer">
          <div class="box b${b}">${b || '–'}</div><div style="flex:1">${esc(c.name)}</div>
          <span class="tiny">›</span>
        </div>`; }).join('')}
    </div>
    <p class="tiny" style="margin-top:10px">A szám a Leitner doboz: 1 = friss, 5 = tartósan bevésve. Minél magasabb, annál ritkábban kérdez rá az app.</p>
  </div>`;
}
const modIds = m => CONCEPTS.filter(c => c.m === m).map(c => c.id);

/* ---------- TANULÓKÁRTYA (magyarázat) ---------- */
function vLearn() {
  const { ids, i } = ctx;
  if (!ids || !ids.length) return `<div class="card center"><h2>Nincs mit tanulni 🎉</h2>
    <button class="btn" style="margin-top:10px" onclick="nav('home')">Vissza</button></div>`;
  if (i >= ids.length) {
    return `<div class="card center">
      <h1>Kész a kör! ✅</h1>
      <p class="muted">${ids.length} fogalmat vettél át. Most jöjjön az ellenőrzés.</p>
      <button class="btn" onclick="nav('quizrun',{qs:buildQuiz(ctxIds(),Math.min(12,${ids.length})),i:0,ok:0,title:'Ellenőrzés'})">🎯 Kvíz a most tanultakból</button>
      <button class="btn sec" style="margin-top:8px" onclick="nav('home')">Főoldal</button>
    </div>`;
  }
  const c = byId(ids[i]), m = modOf(c.m);
  return `
  <div class="card">
    <div class="sb"><button class="btn ghost sm" onclick="nav('home')">✕ Kilépés</button>
      <span class="tiny">${i + 1} / ${ids.length}</span></div>
    <div class="prog" style="margin-top:12px"><i style="width:${(i) / ids.length * 100}%"></i></div>
    <span class="pill">${m.emoji} ${m.num}. modul</span>
    <div class="concept-name">${esc(c.name)}</div>
    <div class="def">${esc(c.short)}</div>
    <div class="blk"><div class="lbl">Magyarázat</div><div>${esc(c.long)}</div></div>
    <div class="blk ex"><div class="lbl">Példa</div><div>${esc(c.example)}</div></div>
    <div class="blk tip"><div class="lbl">Vizsgatipp</div><div>${esc(c.tip)}</div></div>
    ${(c.confuse || []).length ? `<div class="blk"><div class="lbl">Ne keverd össze</div>
      <div>${c.confuse.map(x => byId(x)).filter(Boolean).map(x => `<span class="chip">${esc(x.name)}</span>`).join('')}</div></div>` : ''}
  </div>
  <div class="grid2">
    <button class="btn sec" onclick="learnStep(-1)" ${i === 0 ? 'disabled' : ''}>← Előző</button>
    <button class="btn" onclick="learnDone('${c.id}')">Megvan, tovább →</button>
  </div>`;
}
const ctxIds = () => (ctx.ids || []).map(byId).filter(Boolean);
function learnStep(d) { nav('learning', { ...ctx, i: Math.max(0, ctx.i + d) }); }
function learnDone(id) {
  if ((S.cards[id].box || 0) === 0) {
    S.cards[id].box = 1; S.cards[id].due = addDays(todayStr(), 1);
    addXP(5); logDay('nw', 1); checkBadges();
  }
  save(); nav('learning', { ...ctx, i: ctx.i + 1 });
}

/* ---------- VILLÁMKÁRTYA ---------- */
function vFlash() {
  const ids = ctx.ids || allIds(), i = ctx.i || 0;
  if (i >= ids.length) return `<div class="card center"><h1>Végigértél! 🃏</h1>
    <button class="btn" style="margin-top:10px" onclick="nav('home')">Főoldal</button></div>`;
  const c = byId(ids[i]);
  return `
  <div class="card tight sb">
    <button class="btn ghost sm" onclick="nav('home')">✕</button>
    <span class="tiny">${i + 1} / ${ids.length} · koppints a kártyára</span>
  </div>
  <div class="flip" id="flip" onclick="this.classList.toggle('on')">
    <div class="flip-in">
      <div class="face"><div class="center"><div class="tiny">Mi a meghatározása?</div>
        <div class="concept-name" style="margin-top:10px">${esc(c.name)}</div></div></div>
      <div class="face back"><div><div class="tiny">${esc(c.name)}</div>
        <div style="margin-top:8px;font-size:15px">${esc(c.short)}</div>
        <div class="blk tip" style="margin-top:12px"><div class="lbl">Tipp</div><div style="font-size:13.5px">${esc(c.tip)}</div></div>
      </div></div>
    </div>
  </div>
  <div class="grid2">
    <button class="btn bad" onclick="flashAns(false)">Nem tudtam</button>
    <button class="btn ok" onclick="flashAns(true)">Tudtam ✓</button>
  </div>`;
}
function flashAns(ok) {
  const ids = ctx.ids, i = ctx.i || 0;
  grade(ids[i], ok); logDay('rev', 1);
  nav('flash', { ids, i: i + 1 });
}

/* ---------- KVÍZ INDÍTÓ ---------- */
function vQuizStart() {
  return `
  <div class="card">
    <h1>🎯 Kvíz</h1>
    <p class="muted">Minden kérdés a 72 fogalomból jön. Rossz válasznál megmutatja, mit választottál és miért nem az a jó.</p>
    <button class="btn" onclick="nav('quizrun',{qs:buildQuiz(CONCEPTS,10),i:0,ok:0,title:'Vegyes kvíz'})">Vegyes kvíz (10 kérdés)</button>
    <button class="btn sec" style="margin-top:8px" onclick="nav('quizrun',{qs:buildQuiz(weakList(),Math.min(10,weakList().length)),i:0,ok:0,title:'Gyenge pontok'})">Gyenge pontjaim (${weakList().length})</button>
  </div>
  ${MODULES.map(m => `
  <div class="card tight sb">
    <div><b>${m.emoji} ${m.num}. ${esc(m.title)}</b><div class="tiny">${modStats(m.id).total} fogalom</div></div>
    <button class="btn sm sec" onclick="nav('quizrun',{qs:buildQuiz(CONCEPTS.filter(c=>c.m==='${m.id}'),10),i:0,ok:0,title:'${esc(m.title)}'})">Indít</button>
  </div>`).join('')}`;
}
function weakList() {
  const w = CONCEPTS.filter(c => { const k = S.cards[c.id]; return k.bad > 0 && k.box < 4; });
  return w.length ? w : CONCEPTS.filter(c => (S.cards[c.id].box || 0) <= 1);
}

/* ---------- KVÍZ FUTÁS ---------- */
function vQuizRun() {
  const { qs, i, ok } = ctx;
  if (!qs.length) return `<div class="card center"><h2>Nincs kérdés ebben a körben.</h2>
    <button class="btn" style="margin-top:10px" onclick="nav('home')">Vissza</button></div>`;
  if (i >= qs.length) {
    const pct = Math.round(ok / qs.length * 100);
    if (!ctx.counted) {
      ctx.counted = true;
      S.stats.qTotal += qs.length; S.stats.qOk += ok; logDay('q', qs.length);
      if (pct === 100) addXP(20);
      save(); checkBadges();
    }
    return `<div class="card center">
      <h1>${pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '💪'} ${ok} / ${qs.length}</h1>
      <div class="concept-name">${pct}%</div>
      <p class="muted">${pct === 100 ? 'Hibátlan! +20 bónusz XP.' : pct >= 80 ? 'Szép munka, már majdnem tökéletes.' : 'A hibás fogalmak visszakerültek az 1. dobozba, hamarosan újra kérdez rájuk az app.'}</p>
      <button class="btn" style="margin-top:12px" onclick="nav('quiz')">Új kvíz</button>
      <button class="btn sec" style="margin-top:8px" onclick="nav('home')">Főoldal</button>
    </div>`;
  }
  const q = qs[i];
  return `
  <div class="card">
    <div class="sb"><button class="btn ghost sm" onclick="nav('home')">✕</button>
      <span class="tiny">${esc(ctx.title || 'Kvíz')} · ${i + 1}/${qs.length} · ${ok} jó</span></div>
    <div class="prog" style="margin-top:12px"><i style="width:${i / qs.length * 100}%"></i></div>
    <div class="q">${q.prompt}</div>
    <div id="opts">${q.opts.map((o, k) => `<button class="opt" data-id="${o.id}" data-k="${k}">${esc(o.text)}</button>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
}
function bindQuiz() {
  const q = ctx.qs[ctx.i];
  if (!q) return;
  document.querySelectorAll('#opts .opt').forEach(btn => {
    btn.onclick = () => {
      const pickId = btn.dataset.id, good = pickId === q.cid;
      const c = byId(q.cid), picked = byId(pickId);
      document.querySelectorAll('#opts .opt').forEach(b => {
        b.disabled = true;
        if (b.dataset.id === q.cid) b.classList.add('right');
        else if (b === btn) b.classList.add('wrong');
      });
      grade(q.cid, good);
      if (view === 'quizrun') ctx.ok += good ? 1 : 0; else ctx.ok += good ? 1 : 0;
      $('#fb').innerHTML = good
        ? `<div class="fb good"><b>Helyes! ✅</b>${esc(c.tip)}</div>
           <button class="btn" style="margin-top:10px" onclick="nextQ()">Tovább →</button>`
        : `<div class="fb bad"><b>Nem ez az. ❌</b>
             <div style="margin-bottom:8px"><b style="display:inline">Amit választottál (${esc(picked ? picked.name : '?')}):</b> ${esc(picked ? trim(picked.short, 170) : '')}</div>
             <div><b style="display:inline">A helyes válasz (${esc(c.name)}):</b> ${esc(trim(c.short, 200))}</div>
           </div>
           <div class="fb good" style="margin-top:8px"><b>Hogy jegyezd meg</b>${esc(c.tip)}</div>
           <button class="btn" style="margin-top:10px" onclick="nextQ()">Értem, tovább →</button>`;
      $('#fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
  });
}
function nextQ() {
  ctx.i++;
  if (view === 'examrun' && ctx.i >= ctx.qs.length) { finishExam(); return; }
  render();
  if (view === 'examrun') startExamTimerTick();
}

/* ---------- PRÓBAVIZSGA ---------- */
function vExam() {
  return `
  <div class="card">
    <h1>🎓 Próbavizsga</h1>
    <p class="muted">30 kérdés mind a 72 fogalomból, 20 perc. A végén megkapod a pontszámot és a hibalistát.</p>
    <div class="grid3" style="margin:12px 0">
      <div class="stat"><b>${S.stats.examBest}%</b><span>legjobb</span></div>
      <div class="stat"><b>${S.stats.examRuns}</b><span>próba</span></div>
      <div class="stat"><b>${masteredCount()}/72</b><span>bevésve</span></div>
    </div>
    <button class="btn" onclick="startExam()">Vizsga indítása</button>
    <p class="tiny" style="margin-top:10px">Tipp: csak akkor éri meg élesben, ha legalább 60 fogalom a 3. doboz felett van.</p>
  </div>`;
}
let examEnd = null, examTimer = null;
function startExam() {
  examEnd = Date.now() + 20 * 60 * 1000;
  S.stats.examRuns++; save();
  nav('examrun', { qs: buildQuiz(CONCEPTS, 30), i: 0, ok: 0, title: 'Próbavizsga', wrong: [] });
  startExamTimerTick();
}
function vExamRun() {
  if (ctx.i >= ctx.qs.length) return vExamDone();
  const base = vQuizRun();
  return `<div class="card tight center" style="position:sticky;top:64px;z-index:30">
    <b id="clock">20:00</b> <span class="tiny">hátralévő idő</span></div>` + base;
}
function startExamTimerTick() {
  clearInterval(examTimer);
  examTimer = setInterval(() => {
    const el = $('#clock'); if (!el) return;
    const left = Math.max(0, examEnd - Date.now());
    const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    el.textContent = m + ':' + String(s).padStart(2, '0');
    if (left <= 0) { clearInterval(examTimer); finishExam(); }
  }, 500);
}
function finishExam() { clearInterval(examTimer); ctx.i = ctx.qs.length; render(); }
function vExamDone() {
  const pct = Math.round(ctx.ok / ctx.qs.length * 100);
  if (!ctx.counted) {
    ctx.counted = true;
    if (pct > S.stats.examBest) S.stats.examBest = pct;
    save(); checkBadges();
  }
  return `<div class="card center">
    <h1>${pct >= 80 ? '🎓' : '📖'} ${ctx.ok} / ${ctx.qs.length}</h1>
    <div class="concept-name">${pct}%</div>
    <p class="muted">${pct >= 80 ? 'Ez vizsgaérett szint. Tartsd meg napi ismétléssel!' : pct >= 60 ? 'Jó alap, de a gyenge pontokat még vedd át.' : 'Még kell rá idő. Menj vissza a tervhez és a modulokhoz.'}</p>
    <button class="btn" style="margin-top:12px" onclick="nav('quizrun',{qs:buildQuiz(weakList(),10),i:0,ok:0,title:'Gyenge pontok'})">Gyenge pontok gyakorlása</button>
    <button class="btn sec" style="margin-top:8px" onclick="nav('home')">Főoldal</button>
  </div>`;
}

/* ---------- TERV ---------- */
function vPlan() {
  const days = planDays(), t = todayStr();
  return `
  <div class="card">
    <h1>🗓️ Tanulóterv</h1>
    <p class="muted">Add meg a vizsga napját, és az app szétosztja a 72 fogalmat, plusz beütemezi az ismétléseket.</p>
    <label class="tiny">Vizsga időpontja</label>
    <input type="date" id="exd" value="${S.examDate}" onchange="setExam(this.value)">
    <div class="grid3" style="margin-top:12px">
      <div class="stat"><b>${days.length}</b><span>nap</span></div>
      <div class="stat"><b>${Math.ceil(CONCEPTS.length / Math.max(1, days.length - 2))}</b><span>új / nap</span></div>
      <div class="stat"><b>${learnedCount()}/72</b><span>elkezdve</span></div>
    </div>
  </div>
  <div class="card">
    <h3>Napi bontás</h3>
    ${days.map(d => `
      <div class="day ${d.date === t ? 'today' : (d.date < t ? 'done' : '')}">
        <div class="daynum">${d.n}. nap</div>
        <div style="flex:1;min-width:0">
          <div class="sb"><b style="font-size:14px">${d.kind}</b><span class="tiny">${d.date.slice(5).replace('-', '.')}.</span></div>
          ${d.newIds.length
            ? `<div class="tiny">${d.newIds.length} új fogalom · ${esc(modOf(d.newIds[0].m).title)}</div>
               <div>${d.newIds.slice(0, 6).map(c => `<span class="chip">${esc(c.name)}</span>`).join('')}${d.newIds.length > 6 ? `<span class="chip">+${d.newIds.length - 6}</span>` : ''}</div>`
            : `<div class="tiny">${d.kind === 'próbavizsga' ? '30 kérdéses éles próba, 20 perc' : 'Minden fogalom átpörgetése villámkártyával'}</div>`}
          <div class="tiny" style="margin-top:4px">+ az aznap esedékes ismétlések</div>
        </div>
      </div>`).join('')}
  </div>
  <div class="card">
    <h3>Hogyan működik a napi rutin</h3>
    <p class="muted">1. Új fogalmak átvétele a tanulókártyákon (magyarázat, példa, tipp).<br>
    2. Azonnali ellenőrző kvíz a most tanultakból.<br>
    3. Esedékes ismétlések: 1 nap, 2 nap, 4 nap, 8 nap, 16 nap múlva jön vissza egy fogalom, ha tudtad. Ha nem, visszaesik az elejére.<br>
    4. Hetente egy próbavizsga.</p>
    <p class="tiny">Ez a Leitner-dobozos módszer, ez a bizonyítottan leghatékonyabb fogalomtanulási rutin. Napi 20 perc többet ér, mint vizsga előtt este 4 óra.</p>
  </div>`;
}
function setExam(v) { if (v) { S.examDate = v; save(); render(); } }

/* ---------- HALADÁS ---------- */
function vProg() {
  const boxes = [0, 0, 0, 0, 0, 0];
  CONCEPTS.forEach(c => boxes[S.cards[c.id].box || 0]++);
  const acc = S.stats.qTotal ? Math.round(S.stats.qOk / S.stats.qTotal * 100) : 0;
  return `
  <div class="card">
    <h1>📊 Haladás</h1>
    <div class="grid3" style="margin:12px 0">
      <div class="stat"><b>${S.xp}</b><span>összes XP</span></div>
      <div class="stat"><b>${S.streak}</b><span>napos sorozat</span></div>
      <div class="stat"><b>${acc}%</b><span>kvíz pontosság</span></div>
    </div>
    <div class="bar"><i style="width:${Math.round(masteredCount() / CONCEPTS.length * 100)}%"></i></div>
    <div class="tiny" style="margin-top:6px">${masteredCount()} / ${CONCEPTS.length} fogalom tartósan bevésve (4. doboz felett)</div>
  </div>
  <div class="card">
    <h3>Dobozok</h3>
    <div class="grid3">
      ${[0,1,2,3,4,5].map(b => `<div class="stat"><b>${boxes[b]}</b><span>${b === 0 ? 'nem látott' : b + '. doboz'}</span></div>`).join('')}
    </div>
  </div>
  <div class="card">
    <h3>Kitűzők</h3>
    ${BADGES.map(b => `<span class="badge ${S.badges.includes(b.id) ? '' : 'off'}">${b.emoji} ${b.name}</span>`).join('')}
  </div>
  ${MODULES.map(m => { const list = CONCEPTS.filter(c => c.m === m.id); return `
  <div class="card">
    <h3>${m.emoji} ${m.num}. ${esc(m.title)}</h3>
    <div class="clist">${list.map(c => { const k = S.cards[c.id]; return `
      <div class="citem"><div class="box b${k.box || 0}">${k.box || '–'}</div>
        <div style="flex:1">${esc(c.name)}</div>
        <span class="tiny">${k.ok}/${k.seen || 0}</span></div>`; }).join('')}</div>
  </div>`; }).join('')}
  <div class="card">
    <h3>Újrakezdés</h3>
    <p class="tiny">Törli az összes haladást ezen az eszközön. Nem visszavonható.</p>
    <button class="btn ghost" onclick="if(confirm('Biztosan törlöd az összes haladást?')){localStorage.removeItem(STORE);location.reload()}">Haladás törlése</button>
  </div>`;
}

/* ---------- indulás ---------- */
load();
document.addEventListener('DOMContentLoaded', () => { render(); });
if (document.readyState !== 'loading') render();

</script>
</body>
</html>
